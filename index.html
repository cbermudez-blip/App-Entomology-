<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#2e7d32" />
    <title>EntomoVía — Aprende entomología</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <!-- Captura cualquier error de JS y lo muestra en pantalla, para no
         quedarnos en 'Cargando…' en silencio si algo falla. -->
    <script>
      window.addEventListener("error", function (e) {
        var el = document.getElementById("boot-msg");
        if (el) {
          el.style.color = "#b71c1c";
          el.textContent =
            "Error: " +
            (e.message || e.error) +
            (e.filename ? " (" + e.filename.split("/").pop() + ")" : "");
        }
      });
      window.addEventListener("unhandledrejection", function (e) {
        var el = document.getElementById("boot-msg");
        if (el) {
          el.style.color = "#b71c1c";
          el.textContent = "Error de carga: " + (e.reason && e.reason.message);
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <p
        id="boot-msg"
        style="padding: 40px; font-family: system-ui; color: #627080"
      >
        Cargando EntomoVía…
      </p>
    </div>

    <!-- Carga React/ReactDOM desde CDN con fallback entre proveedores, y luego
         los scripts de la app en orden. Si un CDN falla, prueba el siguiente;
         si todos fallan, muestra un mensaje en vez de quedarse colgado. -->
    <script>
      (function () {
        var REACT_CDNS = [
          [
            "https://unpkg.com/react@18/umd/react.production.min.js",
            "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js",
          ],
          [
            "https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js",
            "https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js",
          ],
          [
            "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
            "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
          ],
        ];
        // ?v= fuerza al navegador a descargar la versión nueva (evita caché vieja).
        var V = "4";
        var APP_SCRIPTS = [
          "./src/data/diptera.js?v=" + V,
          "./src/exercises.js?v=" + V,
          "./src/app.js?v=" + V,
        ];

        function loadScript(url) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = url;
            s.crossOrigin = "anonymous";
            s.onload = resolve;
            s.onerror = function () {
              reject(new Error("No se pudo cargar: " + url));
            };
            document.head.appendChild(s);
          });
        }

        function fail(msg) {
          var el = document.getElementById("boot-msg");
          if (el) {
            el.textContent = msg;
            el.style.color = "#b71c1c";
          }
        }

        function loadApp() {
          APP_SCRIPTS.reduce(function (p, src) {
            return p.then(function () {
              return loadScript(src);
            });
          }, Promise.resolve()).catch(function (err) {
            fail("No se pudo cargar la app: " + err.message);
          });
        }

        function tryCdn(i) {
          if (i >= REACT_CDNS.length) {
            fail(
              "No se pudo cargar React desde ningún CDN. Revisa tu conexión a internet e intenta recargar.",
            );
            return;
          }
          var pair = REACT_CDNS[i];
          loadScript(pair[0])
            .then(function () {
              return loadScript(pair[1]);
            })
            .then(function () {
              if (!window.React || !window.ReactDOM)
                throw new Error("React no definido");
              loadApp();
            })
            .catch(function () {
              tryCdn(i + 1);
            });
        }

        tryCdn(0);
      })();
    </script>
  </body>
</html>
